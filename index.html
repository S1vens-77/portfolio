<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>工业设计作品集</title>
<style>
  :root{--bg:#07080a;--ink:#f2f3f5;--muted:#8b929c;--line:rgba(255,255,255,.09);--accent:#e0453f;--pad:clamp(20px,5vw,72px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;pointer-events:none;
    background:radial-gradient(60% 60% at 70% 0%,rgba(224,69,63,.14),transparent 70%)}
  .page{position:relative;max-width:1180px;margin:0 auto;padding:0 var(--pad)}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;
    border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .brand{color:var(--ink);display:flex;align-items:center;gap:10px;letter-spacing:.24em}
  .brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .hero{padding:clamp(56px,9vw,104px) 0 clamp(36px,5vw,60px)}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
  h1{font-size:clamp(42px,8vw,100px);line-height:.98;letter-spacing:-.035em;font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{margin-top:26px;color:var(--muted);max-width:50ch;font-size:15px;line-height:1.8}
  .list{border-top:1px solid var(--line);margin-top:clamp(30px,5vw,52px)}
  .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto 30px;gap:clamp(14px,2.4vw,32px);
    align-items:center;padding:clamp(22px,3.2vw,34px) 4px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;transition:padding .3s ease}
  .row:hover{padding-left:14px}
  .num{font-size:11px;letter-spacing:.18em;color:#5f666f;align-self:start;padding-top:6px}
  .row:hover .num{color:var(--accent)}
  .t{display:block;font-size:clamp(18px,2.3vw,26px);font-weight:650;letter-spacing:-.01em}
  .d{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);max-width:58ch}
  .sz{font-size:11.5px;color:#5f666f;letter-spacing:.08em;text-align:right;white-space:nowrap}
  .arrow{color:#5f666f;text-align:right;transition:transform .3s ease,color .3s ease}
  .row:hover .arrow{color:var(--accent);transform:translate(3px,-3px)}
  footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:32px 0 44px;border-top:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#5f666f}
  @media (max-width:720px){.row{grid-template-columns:36px minmax(0,1fr) 26px}.sz{display:none}.d{display:none}}
</style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <span class="brand"><i></i><span>Portfolio</span></span>
    <span>Index — 02</span>
  </nav>

  <section class="hero">
    <p class="eyebrow">Selected Work</p>
    <h1>工业设计<br><em>作品集</em></h1>
    <p class="lead">两份完整项目文件，点击即可在浏览器中直接查看。</p>
  </section>

  <main class="list">
    <a class="row" href="lunar-rover-industrial-design.pdf" target="_blank" rel="noopener">
      <span class="num">01</span>
      <span><span class="t">「探索」号载人月球车 · 概念方案设计</span>
        <span class="d">整车涂装概念方案：前期草图与设计定位，以中国红与汉字「中」为设计语言，含三视图、细节特写与场景渲染。</span></span>
      <span class="sz">31 页 · 4.0 MB</span>
      <span class="arrow">↗</span>
    </a>
    <a class="row" href="ar-120fh-uav-design.pdf" target="_blank" rel="noopener">
      <span class="num">02</span>
      <span><span class="t">AR-120FH 无人机 · 外观涂装设计</span>
        <span class="d">从设计调研、硬点分析到概念草图，输出两套涂装方案，附效果图与贴膜可展开性说明。</span></span>
      <span class="sz">32 页 · 5.9 MB</span>
      <span class="arrow">↗</span>
    </a>
  </main>

  <footer>
    <span>© 2026 · 内容仅用于求职评审</span>
    <span>Click to open ↗</span>
  </footer>
</div>
</body>
</html>
